name: Reusable CD

on:
  workflow_call:

    inputs:

      aws-region:
        required: true
        type: string

      ecr-repository:
        required: true
        type: string

      eks-cluster-name:
        required: true
        type: string

      helm-release:
        required: true
        type: string

      helm-chart:
        required: true
        type: string

      image-tag:
        required: true
        type: string

      image-uri:
        required: true
        type: string

    secrets:

      AWS_ACCESS_KEY_ID:
        required: true

      AWS_SECRET_ACCESS_KEY:
        required: true


jobs:

  deploy-to-eks:

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------
      # 2. Configure AWS credentials
      # ------------------------------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ inputs.aws-region }}


      # ------------------------------------------------
      # 3. Verify AWS identity
      # ------------------------------------------------

      - name: Verify AWS identity
        run: |
          echo "AWS Region: ${{ inputs.aws-region }}"
          echo "EKS Cluster: ${{ inputs.eks-cluster-name }}"
          echo "ECR Repository: ${{ inputs.ecr-repository }}"

          aws sts get-caller-identity


      # ------------------------------------------------
      # 4. Verify EKS cluster
      # ------------------------------------------------

      - name: Verify EKS cluster
        run: |
          aws eks describe-cluster \
            --region "${{ inputs.aws-region }}" \
            --name "${{ inputs.eks-cluster-name }}" \
            --query "cluster.status" \
            --output text


      # ------------------------------------------------
      # 5. Configure kubectl
      # ------------------------------------------------

      - name: Configure kubectl
        run: |
          aws eks update-kubeconfig \
            --region "${{ inputs.aws-region }}" \
            --name "${{ inputs.eks-cluster-name }}"


      # ------------------------------------------------
      # 6. Verify kubectl context
      # ------------------------------------------------

      - name: Verify kubectl context
        run: |
          kubectl config current-context


      # ------------------------------------------------
      # 7. Verify EKS access
      # ------------------------------------------------

      - name: Verify EKS connection
        run: |
          kubectl get nodes


      # ------------------------------------------------
      # 8. Verify Helm
      # ------------------------------------------------

      - name: Verify Helm
        run: |
          helm version


      # ------------------------------------------------
      # 9. Validate Helm chart
      # ------------------------------------------------

      - name: Validate Helm chart
        run: |
          helm lint "${{ inputs.helm-chart }}" \
            -f "${{ inputs.helm-chart }}/values.yaml"


      # ------------------------------------------------
      # 10. Verify CI image values
      # ------------------------------------------------

      - name: Verify image inputs
        run: |
          echo "======================================"
          echo "IMAGE INFORMATION"
          echo "======================================"
          echo "Image Tag:"
          echo "${{ inputs.image-tag }}"
          echo ""
          echo "Image URI:"
          echo "${{ inputs.image-uri }}"
          echo "======================================"

          if [ -z "${{ inputs.image-tag }}" ]; then
            echo "ERROR: image-tag is empty"
            exit 1
          fi

          if [ -z "${{ inputs.image-uri }}" ]; then
            echo "ERROR: image-uri is empty"
            exit 1
          fi


      # ------------------------------------------------
      # 11. Deploy application
      # ------------------------------------------------

      - name: Deploy Helm chart
        run: |
          IMAGE_REPOSITORY=$(echo "${{ inputs.image-uri }}" | cut -d: -f1)

          echo "======================================"
          echo "DEPLOYMENT INFORMATION"
          echo "======================================"
          echo "Helm Release: ${{ inputs.helm-release }}"
          echo "Helm Chart: ${{ inputs.helm-chart }}"
          echo "Image Repository: ${IMAGE_REPOSITORY}"
          echo "Image Tag: ${{ inputs.image-tag }}"
          echo "======================================"

          helm upgrade --install \
            "${{ inputs.helm-release }}" \
            "${{ inputs.helm-chart }}" \
            -f "${{ inputs.helm-chart }}/values.yaml" \
            --set image.repository="${IMAGE_REPOSITORY}" \
            --set image.tag="${{ inputs.image-tag }}" \
            --wait \
            --timeout 10m


      # ------------------------------------------------
      # 12. Verify Helm release
      # ------------------------------------------------

      - name: Verify Helm release
        if: always()
        run: |
          helm list -A

          echo "===== HELM STATUS ====="

          helm status "${{ inputs.helm-release }}" \
            -n default || true


      # ------------------------------------------------
      # 13. Verify Kubernetes resources
      # ------------------------------------------------

      - name: Verify application
        if: always()
        run: |

          echo "======================================"
          echo "PODS"
          echo "======================================"

          kubectl get pods -o wide || true


          echo "======================================"
          echo "SERVICES"
          echo "======================================"

          kubectl get services || true


          echo "======================================"
          echo "DEPLOYMENTS"
          echo "======================================"

          kubectl get deployments || true


          echo "======================================"
          echo "INGRESS"
          echo "======================================"

          kubectl get ingress || true


      # ------------------------------------------------
      # 14. Show events if deployment failed
      # ------------------------------------------------

      - name: Show Kubernetes events
        if: failure()
        run: |
          kubectl get events \
            --sort-by=.lastTimestamp || true