{% extends "base.html" %}{% block title %}Jira / Operations Tickets{% endblock %}
{% block content %}
<div class="panel"><h2>Create Ticket</h2><form method="post" class="formgrid">
<input name="jira_key" placeholder="Jira key e.g. LOG-103"><input name="title" placeholder="Ticket title" required>
<input name="assignee" placeholder="Assignee"><select name="priority"><option>Low</option><option selected>Medium</option><option>High</option><option>Critical</option></select>
<textarea name="description" placeholder="Description"></textarea><button>Create Ticket</button></form></div>
<div class="panel"><h2>Tickets</h2><table><tr><th>Key</th><th>Title</th><th>Priority</th><th>Assignee</th><th>Status</th><th>Change</th></tr>
{% for t in tickets %}<tr><td>{{t.jira_key or "-"}}</td><td>{{t.title}}</td><td>{{t.priority}}</td><td>{{t.assignee or "-"}}</td><td>{{t.status}}</td>
<td><form method="post" action="/tickets/{{t.id}}/status"><select name="status" onchange="this.form.submit()">
{% for s in ["Open","In Progress","Blocked","Done"] %}<option {% if t.status==s %}selected{% endif %}>{{s}}</option>{% endfor %}
</select></form></td></tr>{% endfor %}</table></div>
{% endblock %}
