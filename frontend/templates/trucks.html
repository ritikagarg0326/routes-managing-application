{% extends "base.html" %}{% block title %}Truck Management{% endblock %}
{% block content %}
<div class="panel"><h2>Add Truck</h2><form method="post" class="formgrid">
<input name="registration" placeholder="Registration" required><input name="driver" placeholder="Driver">
<input name="capacity" type="number" step="0.1" placeholder="Capacity (tons)"><button>Add Truck</button></form></div>
<div class="panel"><h2>Trucks</h2><table><tr><th>Registration</th><th>Driver</th><th>Capacity</th><th>Status</th></tr>
{% for x in trucks %}<tr><td>{{ x.registration }}</td><td>{{ x.driver }}</td><td>{{ x.capacity }}</td><td>{{ x.status }}</td></tr>{% endfor %}</table></div>
{% endblock %}
